<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<title>Sugam Dial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE  calm Google-style utility, Material 2 (Notes design system)
   IDEA   a pocket office directory: favourite districts, contacts, complaints
   PICTURE the working list itself
   COLOUR white / #202124, one blue accent, red only for overdue
   TYPE   Kumbh Sans, Material type scale (+2px on phones) */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#202124);--surface:light-dark(#ffffff,#2d2e31);--text:light-dark(#202124,#e8eaed);--text2:light-dark(#5f6368,#9aa0a6);
--line:light-dark(#dadce0,#3c4043);--blue:light-dark(#1a73e8,#8ab4f8);--blue-text:light-dark(#1967d2,#8ab4f8);--tint:light-dark(#e8f0fe,rgba(138,180,248,.16));
--hover:light-dark(rgba(60,64,67,.08),rgba(232,234,237,.08));--press:light-dark(rgba(60,64,67,.14),rgba(232,234,237,.14));
--red:light-dark(#d93025,#f28b82);--red-tint:light-dark(#fce8e6,rgba(242,139,130,.16));--chip:light-dark(#f1f3f4,#3c4043);
--snack:light-dark(#202124,#e8eaed);--snack-text:light-dark(#e8eaed,#202124);--snack-action:light-dark(#8ab4f8,#1a73e8);--on-blue:light-dark(#ffffff,#202124);
--sh1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);--sh2:0 1px 2px 0 rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
--sh3:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);--sh4:0 2px 3px 0 rgba(60,64,67,.3),0 6px 10px 4px rgba(60,64,67,.15)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--sh1:0 1px 2px 0 rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--sh2:0 1px 2px 0 rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);--sh3:0 1px 3px 0 rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);--sh4:0 2px 3px 0 rgba(0,0,0,.3),0 6px 10px 4px rgba(0,0,0,.15)}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/24px "Kumbh Sans",Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.25px;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:752px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.bar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar.pad{padding:0 4px 0 16px;gap:12px}
.bar h1{margin:0;flex:1;font-size:22px;line-height:28px;font-weight:400;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar h1.brand{color:var(--text2)}
.logo{width:32px;height:32px;border-radius:8px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}
.ib{width:48px;height:48px;border:0;border-radius:999px;background:transparent;color:var(--text2);display:grid;place-items:center;flex:none;transition:background .12s}
.ib:hover{background:var(--hover)}.ib:active{background:var(--press)}
.ib.on{color:var(--blue)}
.ib.tonal{background:var(--tint);color:var(--blue-text)}
.ib.tonal:disabled{background:var(--chip);color:var(--text2);opacity:.6;cursor:default}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
svg.s{width:20px;height:20px}
.btn{height:36px;padding:0 24px;border:0;border-radius:4px;background:var(--blue);color:var(--on-blue);font-size:14px;font-weight:500;letter-spacing:.1px;box-shadow:var(--sh1);display:inline-flex;align-items:center;gap:8px;flex:none}
.btn:disabled{background:var(--chip);color:var(--text2);box-shadow:none;cursor:default}
.tb{height:36px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--blue);font-size:14px;font-weight:500;letter-spacing:.1px;display:inline-flex;align-items:center;gap:8px;flex:none}
.tb:hover{background:var(--tint)}
.ob{border:1px solid var(--line);background:var(--surface);color:var(--blue);border-radius:8px;font-size:14px;font-weight:500}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chip{height:32px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;letter-spacing:.1px;flex:none;white-space:nowrap}
.chip.on{border-color:transparent;background:var(--tint);color:var(--blue-text)}
.sh{margin:0;padding:16px 24px 4px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--text2)}
.sh-row{display:flex;align-items:center;justify-content:space-between;padding-right:16px}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--sh1)}
.ocard{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search{margin:4px 16px 16px;height:48px;border:0;border-radius:8px;background:var(--surface);box-shadow:var(--sh2);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--text2);width:calc(100% - 32px);text-align:left;font-size:16px}
.row{min-height:72px;display:flex;align-items:center;gap:4px;padding:4px 12px 4px 0}
.row>.main{flex:1;border:0;background:transparent;text-align:left;padding:8px 0 8px 24px;border-radius:0 999px 999px 0;color:var(--text)}
.row>.main:hover{background:var(--hover)}
.t1{display:block;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.t2{display:block;font-size:14px;line-height:20px;color:var(--text2)}
.t3{display:block;font-size:12px;line-height:16px;color:var(--text2);letter-spacing:.4px}
.tag{display:inline-block;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px;color:var(--blue-text)}
.badge{height:24px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;flex:none}
.badge.open{background:var(--red-tint);color:var(--red)}.badge.done{background:var(--tint);color:var(--blue-text)}
.empty{padding:40px 32px;text-align:center;font-size:14px;line-height:20px;color:var(--text2)}
.field{display:block;position:relative;margin:0}
.field>span{position:absolute;top:-8px;left:12px;background:var(--bg);padding:0 4px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;color:var(--text2)}
.card .field>span,.edit .field>span{background:var(--surface)}
.field input,.field textarea,.field select{width:100%;min-height:56px;border:1px solid var(--line);border-radius:4px;padding:15px 16px;font-size:16px;background:transparent;color:var(--text);outline:0}
.field textarea{resize:vertical;min-height:112px}
.field select{appearance:none;padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(-45deg,transparent 50%,currentColor 50%);background-position:calc(100% - 22px) 26px,calc(100% - 17px) 26px;background-size:5px 5px;background-repeat:no-repeat}
.field :focus{border:2px solid var(--blue);padding:14px 15px}
.field:focus-within>span{color:var(--blue)}
.form{padding:16px;display:flex;flex-direction:column;gap:24px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:0 16px}
.ph{aspect-ratio:1;border-radius:8px;background:var(--chip);overflow:hidden;position:relative;border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(32,33,36,.7);color:#fff;display:grid;place-items:center}
.addph{aspect-ratio:1;border:1px dashed var(--line);border-radius:8px;background:var(--surface);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:500}
.hint{margin:16px;padding:12px 16px;border-radius:8px;background:var(--chip);display:flex;gap:12px;font-size:14px;line-height:20px}
.hint svg{fill:var(--text2)}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line);position:sticky;top:64px;background:var(--bg);z-index:4}
.tab{height:48px;border:0;background:transparent;font-size:14px;font-weight:500;letter-spacing:.1px;color:var(--text2);border-bottom:2px solid transparent}
.tab.on{color:var(--blue-text);border-bottom-color:var(--blue)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);box-shadow:0 -1px 3px rgba(60,64,67,.15);z-index:10}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--text2)}
.nav button span.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav button.on{color:var(--blue-text)}.nav button.on span.pill{background:var(--tint)}
.snack{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:48px;padding:6px 8px 6px 16px;border-radius:4px;background:var(--snack);color:var(--snack-text);display:flex;align-items:center;gap:12px;box-shadow:var(--sh4);font-size:14px;line-height:20px;z-index:30;transform:translateY(0);transition:transform .2s,opacity .2s}
.snack.hasnav{bottom:calc(96px + env(safe-area-inset-bottom))}
.snack[hidden]{display:flex;opacity:0;transform:translateY(16px);pointer-events:none}
.snack button{border:0;background:transparent;color:var(--snack-action);font-size:14px;font-weight:500;height:36px;padding:0 8px;flex:none}
.menu{position:absolute;right:8px;top:56px;min-width:220px;background:var(--surface);border-radius:4px;box-shadow:var(--sh4);padding:8px 0;z-index:20}
.menu button{display:block;width:100%;height:48px;border:0;background:transparent;text-align:left;padding:0 16px;font-size:16px}
.menu button:hover{background:var(--hover)}
.scrim{position:fixed;inset:0;z-index:19}
.edit{margin:4px 16px 8px;padding:20px 16px 16px;border-radius:8px;background:var(--surface);box-shadow:var(--sh2);display:flex;flex-direction:column;gap:16px}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.acts .left{margin-right:auto}
.composer{margin:16px 16px 12px;padding:4px 4px 4px 16px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;padding:12px 8px 8px 0;font-size:16px;line-height:24px;color:var(--text);min-height:48px}
.composer .tools{display:flex;align-items:center;gap:4px;margin-left:-12px;flex-wrap:wrap}
.composer select{flex:1;min-width:120px;height:40px;border:0;background:transparent;color:var(--text2);font-size:14px;padding:0 8px}
.cmini{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 8px 0}
.cmini .ph{width:64px}
.comp{margin:0 16px 12px;overflow:hidden}
.comp .top{display:flex;gap:12px;padding:16px 8px 4px 16px;align-items:flex-start}
.comp .strip{display:flex;gap:8px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.comp .strip .ph{width:72px;flex:none}
.comp .acts{justify-content:flex-start;padding:4px 8px 4px}
.cmts{border-top:1px solid var(--line);padding:4px 8px 4px 16px}
.cmt{padding:8px 8px 8px 0}
.cmt p{margin:0;font-size:14px;line-height:20px;white-space:pre-line}
.cadd{display:flex;align-items:center;gap:4px}
.cadd input{flex:1;height:44px;border:0;outline:0;background:transparent;font-size:16px;color:var(--text)}
.fav{width:calc(100% - 32px);margin:0 16px 12px;border:0;padding:16px;display:flex;align-items:center;gap:16px;text-align:left;color:var(--text)}
.av{width:48px;height:48px;border-radius:999px;background:var(--tint);color:var(--blue-text);display:grid;place-items:center;font-weight:600;flex:none}
.pick{width:100%;min-height:52px;border:0;background:transparent;display:flex;align-items:center;gap:24px;padding:0 24px;text-align:left;color:var(--text)}
.pick.on{background:var(--tint)}
.box{width:18px;height:18px;border:2px solid var(--text2);border-radius:2px;display:grid;place-items:center;flex:none}
.pick.on .box{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -1px 3px rgba(60,64,67,.15);padding:12px 16px calc(16px + env(safe-area-inset-bottom));z-index:10}
.foot>div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 16px}
.big3 button{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big3 .btn{height:72px;padding:0;border-radius:8px;justify-content:center;flex-direction:column;gap:4px}
.inf{display:flex;gap:24px;align-items:center;padding:8px 16px 8px 24px}
.inf svg{fill:var(--text2)}
.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;justify-content:space-between;padding:8px;color:#fff}
.viewer .ib{color:#fff}
.note{margin:0 16px 8px;padding:12px 16px;width:calc(100% - 32px);text-align:left;display:block;color:var(--text)}
.note p{margin:0 0 6px;font-size:14px;line-height:20px;white-space:pre-line}
.banner{margin:12px 16px 4px;padding:12px 16px;border-radius:8px;background:var(--tint);color:var(--text);font-size:14px;line-height:20px;display:flex;gap:12px;align-items:flex-start}
.banner .tb{margin:-6px -8px -6px auto}
@media (max-width:899px){body{font-size:16px}.bar h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ic=(n,c='i')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;

/* photos live in IndexedDB as compressed JPEGs */
let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('sugamdial',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function pPut(id,blob){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function pGet(id){const db=await idb();return new Promise(res=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
async function pDel(id){try{const db=await idb();db.transaction('photos','readwrite').objectStore('photos').delete(id)}catch(e){}}
async function pAll(){const db=await idb();return new Promise(res=>{const out={};const r=db.transaction('photos').objectStore('photos').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>res(out)})}
const urls={};
async function hydrate(){
  for(const img of document.querySelectorAll('img[data-pid]')){
    const id=img.dataset.pid;
    if(!urls[id]){const b=await pGet(id);if(!b)continue;urls[id]=URL.createObjectURL(b)}
    img.src=urls[id];
  }
}
function shrink(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),'image/jpeg',.85)};
    im.onerror=()=>{URL.revokeObjectURL(url);res(file)};im.src=url;
  });
}
async function addPhotos(files){
  const ids=[];
  for(const f of files){const b=await shrink(f);const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);try{await pPut(id,b);ids.push(id)}catch(e){toast('Could not store the photo on this phone.')}}
  return ids;
}

/* ---------- time ---------- */
function when(at){
  const d=new Date(at),n=new Date();const t=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=(day(n)-day(d))/864e5;
  if(diff===0)return 'Today, '+t;if(diff===1)return 'Yesterday, '+t;
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'})+', '+t;
}

async function viewPhoto(id,owner){
  const b=await pGet(id);if(!b)return;if(!urls[id])urls[id]=URL.createObjectURL(b);
  const v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-label','Photo');
  v.innerHTML=`<div class="vb"><button class="ib" aria-label="Close">${ic('close')}</button>${owner?`<button class="ib" aria-label="Delete photo">${ic('del')}</button>`:''}</div><img src="${urls[id]}" alt="Complaint photo">`;
  const [cl,dl]=v.querySelectorAll('button');cl.onclick=()=>v.remove();
  if(dl)dl.onclick=()=>{const c=S.complaints.find(x=>'c'+x.id===owner);if(c){c.photos=c.photos.filter(p=>p!==id);save();pDel(id)}v.remove();render();toast('Photo deleted')};
  document.body.append(v);cl.focus();
}

/* ---------- sharing ---------- */
async function shareComplaint(c){
  const text=[c.title,c.details,'For: '+where(c),'Since: '+when(c.at),c.comments.length?'Updates:\n'+c.comments.map(m=>'- '+m.text+' ('+when(m.at)+')').join('\n'):''].filter(Boolean).join('\n');
  const files=[];for(const id of c.photos){const b=await pGet(id);if(b)files.push(new File([b],id+'.jpg',{type:'image/jpeg'}))}
  try{
    if(files.length&&navigator.canShare&&navigator.canShare({files})){await navigator.share({title:c.title,text,files});return}
    if(navigator.share){await navigator.share({title:c.title,text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(text);a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();
}

/* ---------- backup ---------- */
async function backup(){
  const photos={};const all=await pAll();
  for(const [k,b] of Object.entries(all)){photos[k]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
  const blob=new Blob([JSON.stringify({app:'sugam-dial',v:1,at:Date.now(),data:S,photos})],{type:'application/json'});
  const name='sugam-dial-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sugam Dial backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
  toast('Backup saved to Downloads');
}
async function restore(file){
  try{
    const j=JSON.parse(await file.text());if(j.app!=='sugam-dial'||!j.data)throw 0;
    for(const [k,u] of Object.entries(j.photos||{})){const b=await (await fetch(u)).blob();await pPut(k,b)}
    S=Object.assign(blank(),j.data);save();rebuildCustom();go({s:'home',tab:'districts'});toast('Backup restored');
  }catch(e){toast('That file is not a Sugam Dial backup.')}
}

    else if(!v||v===o.phone)delete S.phones[o.id];else S.phones[o.id]=v;
    save();ui.ep=null;render();toast(v?'Number saved for '+o.short:'Number removed')},
  phreset:(el)=>{delete S.phones[el.dataset.id];save();ui.ep=null;render();toast('Back to the RSRDC number')},
  addc:()=>{ui.addc=true;render();document.getElementById('ncName')?.focus()},
  addcCancel:()=>{ui.addc=false;render()},
  addcSave:()=>{const name=document.getElementById('ncName').value.trim();if(!name){document.getElementById('ncName').focus();return}
    const level='Other',phone=document.getElementById('ncPhone').value.trim();
    const c={id:'u'+nid(),distId:R.id,level,name,short:name.length>28?name.slice(0,26)+'…':name,phone};S.custom.push(c);save();rebuildCustom();ui.addc=false;render();toast('Contact added')},
  delc:(el)=>{const id=el.dataset.id;const c=S.custom.find(x=>x.id===id);S.custom=S.custom.filter(x=>x.id!==id);save();rebuildCustom();back();
    toast('Contact removed','Undo',()=>{S.custom.push(c);save();rebuildCustom();render()})},
  cam:()=>{photoTarget=R.s;document.getElementById('fCam').click()},
  gal:()=>{photoTarget=R.s;document.getElementById('fGal').click()},
  dprm:(el)=>{pDel(el.dataset.id);ui.dp=(ui.dp||[]).filter(x=>x!==el.dataset.id);render()},
  cadd:()=>{const t=(ui.ct||'').trim();if(!t){document.getElementById('ctext').focus();return}
    const lines=t.split('\n');S.complaints.unshift({id:nid(),distId:R.id,officeId:ui.cto||null,title:lines[0].trim(),details:lines.slice(1).join('\n').trim(),photos:ui.dp||[],status:'open',at:Date.now(),comments:[]});
    save();ui.ct='';ui.dp=[];ui.cto='';render();toast('Complaint saved on this phone')},
  newc:(el)=>{const o=D.offices[el.dataset.id];ui.dp=[];ui.fs=ui.fd='';ui.saved=false;go({s:'newc',dist:o.distId,office:o.id})},
  newn:(el)=>{const o=D.offices[el.dataset.id];ui.nt='';go({s:'newn',dist:o.distId,office:o.id})},
  csave:()=>{const subj=document.getElementById('fSubj').value.trim(),det=document.getElementById('fDet').value.trim();
    if(!subj&&!det){document.getElementById('fSubj').focus();return}
    S.complaints.unshift({id:nid(),distId:R.dist,officeId:document.getElementById('fFor').value||null,title:subj||det.split('\n')[0],details:subj?det:det.split('\n').slice(1).join('\n'),photos:ui.dp||[],status:'open',at:Date.now(),comments:[]});
    save();ui.saved=true;ui.dp=[];ui.fs=ui.fd='';back();setTimeout(()=>toast('Complaint saved on this phone'),50)},
  nsave:()=>{const t=document.getElementById('nText').value.trim();if(!t){document.getElementById('nText').focus();return}
    S.notes.unshift({id:nid(),distId:R.dist,officeId:document.getElementById('nFor').value||null,text:t,at:Date.now()});save();ui.nt='';back();setTimeout(()=>toast('Note saved'),50)},
  ctoggle:(el)=>{const c=S.complaints.find(x=>x.id==el.dataset.id);c.status=c.status==='open'?'resolved':'open';c.resolvedAt=c.status==='resolved'?Date.now():null;save();const y=scrollY;render();scrollTo(0,y);
    toast(c.status==='resolved'?'Marked resolved':'Reopened','Undo',()=>{c.status=c.status==='open'?'resolved':'open';save();render()})},
  cdel:(el)=>{const i=S.complaints.findIndex(x=>x.id==el.dataset.id);const c=S.complaints[i];S.complaints.splice(i,1);save();const y=scrollY;render();scrollTo(0,y);
    let undone=false;toast('Complaint deleted','Undo',()=>{undone=true;S.complaints.splice(i,0,c);save();render()});setTimeout(()=>{if(!undone)c.photos.forEach(pDel)},7500)},
  cpost:(el)=>{const id=el.dataset.id;const txt=((ui.cd||{})[id]||'').trim();if(!txt)return;const c=S.complaints.find(x=>x.id==id);c.comments.push({text:txt,at:Date.now()});save();ui.cd[id]='';const y=scrollY;render();scrollTo(0,y)},
  cshare:(el)=>shareComplaint(S.complaints.find(x=>x.id==el.dataset.id)),
  cf:(el)=>{ui.cf=el.dataset.v;render()},
  cs:(el)=>{ui.cs=el.dataset.v;render()},
  cqclear:()=>{ui.cq='';render();document.getElementById('cq')?.focus()},
  view:(el)=>viewPhoto(el.dataset.id,el.dataset.owner)
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;
  const keep=fn(el,e);if(keep!==true&&el.tagName==='A')e.preventDefault();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'||t.id==='cq'){ui[t.id]=t.value;const pos=t.selectionStart,id=t.id,y=scrollY;render();scrollTo(0,y);const n=document.getElementById(id);n.focus();n.setSelectionRange(pos,pos)}
  else if(t.id==='ctext'){ui.ct=t.value;t.rows=t.value?3:1}
  else if(t.id==='cto')ui.cto=t.value;
  else if(t.id==='fSubj')ui.fs=t.value;else if(t.id==='fDet')ui.fd=t.value;else if(t.id==='nText')ui.nt=t.value;
  else if(t.dataset.cd){ui.cd=ui.cd||{};ui.cd[t.dataset.cd]=t.value}
});
document.addEventListener('change',e=>{if(e.target.id==='cto')ui.cto=e.target.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.querySelector('.viewer'))document.querySelector('.viewer').remove();else if(menuOpen)closeMenu()}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.cd){e.preventDefault();A.cpost({dataset:{id:e.target.dataset.cd}})}
});
for(const id of ['fCam','fGal'])document.getElementById(id).addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  const ids=await addPhotos(files);ui.dp=(ui.dp||[]).concat(ids);if(R.s===photoTarget)render();
});
document.getElementById('fRestore').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f)});

/* ---------- start ---------- */
R=S.onboarded?{s:'home',tab:'districts'}:{s:'pick'};
try{history.replaceState(R,'')}catch(e){}
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
