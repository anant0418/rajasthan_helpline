<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">
<title>Sugam Dial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  a calm contacts app: people first, few buttons
   IDEA   an address book: search on top, labels on the side, one card of names
   PICTURE the list itself; round initials carry the colour
   COLOUR pale blue-white ground, white card, one blue, red only for open complaints
   TYPE   Kumbh Sans; 14px medium for names and labels on desktop, 16px on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f8fafd,#131314);--card:light-dark(#ffffff,#1e1f20);--text:light-dark(#1f1f1f,#e3e3e3);--text2:light-dark(#444746,#c4c7c5);
--line:light-dark(#c4c7c5,#444746);--soft:light-dark(#f0f4f9,#282a2c);--field:light-dark(#e9eef6,#282a2c);
--blue:light-dark(#0b57d0,#a8c7fa);--on-blue:light-dark(#ffffff,#062e6f);--tonal:light-dark(#c2e7ff,#004a77);--on-tonal:light-dark(#001d35,#c2e7ff);
--red:light-dark(#b3261e,#f2b8b5);--red-tint:light-dark(#f9dedc,#8c1d18);--done:light-dark(#e8f0fe,#0842a0);--on-done:light-dark(#0842a0,#d3e3fd);
--snack:light-dark(#303030,#e3e3e3);--snack-text:light-dark(#f2f2f2,#303030);--snack-action:light-dark(#a8c7fa,#0b57d0);
--sh1:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);--sh3:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/20px "Kumbh Sans",Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.1px;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}svg.s{width:20px;height:20px}svg.xs{width:16px;height:16px}

/* top bar */
.top{height:64px;display:flex;align-items:center;gap:4px;padding:0 16px 0 8px;position:sticky;top:0;z-index:20;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;width:220px;flex:none;padding-left:4px;font-size:20px;line-height:28px}
.mark{width:32px;height:32px;border-radius:999px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}
.search{flex:1;max-width:720px;height:48px;border-radius:24px;background:var(--field);display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;color:var(--text2)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:var(--text)}
.ib{width:48px;height:48px;border:0;border-radius:999px;background:transparent;color:var(--text2);display:grid;place-items:center;flex:none;transition:background .12s}
.ib:hover{background:var(--soft)}
.ib.sm{width:40px;height:40px}
.menu-btn{display:none}

/* shell */
.shell{display:flex;align-items:flex-start}
.side{flex:0 0 280px;padding:8px 16px 32px 12px;position:sticky;top:64px;max-height:calc(100vh - 64px);overflow-y:auto}
.add{display:inline-flex;align-items:center;gap:12px;height:56px;margin:0 0 12px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--tonal);color:var(--on-tonal);font-weight:500;box-shadow:none}
.add:hover{box-shadow:var(--sh1)}
.nv{width:100%;height:48px;display:flex;align-items:center;gap:16px;padding:0 24px 0 16px;border:0;border-radius:24px;background:transparent;color:var(--text);font-weight:500;text-align:left}
.nv.big{height:56px;border-radius:28px}
.nv:hover{background:var(--soft)}
.nv.on{background:var(--tonal);color:var(--on-tonal)}
.nv .n{color:var(--text2);font-weight:500}.nv.on .n{color:inherit}
.nv svg{fill:var(--text2)}.nv.on svg{fill:currentColor}
.nh{display:flex;align-items:center;height:48px;padding:8px 4px 0 16px;font-weight:500}
.nh span{flex:1}
.card{flex:1;margin:0 16px 16px 0;background:var(--card);border-radius:16px;padding:20px 24px 32px;min-height:calc(100vh - 80px)}
h1.title{margin:0 0 12px 8px;font-size:22px;line-height:28px;font-weight:400}
h1.title small{font-size:14px;color:var(--text2)}

/* chips */
.chips{display:flex;gap:8px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
.chip{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:500;flex:none;white-space:nowrap;color:var(--text)}
.chip.on{border-color:transparent;background:var(--done);color:var(--on-done)}

/* contact rows: table on desktop, list on phone */
.thead,.crow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr) 88px;align-items:center;column-gap:8px}
.thead{font-weight:500;padding:12px 8px;border-bottom:1px solid var(--line)}
.sec{display:flex;align-items:center;gap:8px;padding:18px 8px 6px;font-size:12px;line-height:16px;font-weight:500;color:var(--text2)}
.sec svg{fill:var(--text2)}
.crow{min-height:56px;padding:4px 8px;border-radius:8px;cursor:pointer;color:var(--text)}
.crow:hover{background:var(--soft)}
.crow .nm{display:flex;align-items:center;gap:12px}
.crow .nm>span{min-width:0;overflow:hidden;display:flex;flex-direction:column}
.crow .nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .sub{display:none}
.crow .ph{font-variant-numeric:tabular-nums;white-space:nowrap}
.crow .ds{color:var(--text2)}
.crow .tag{display:inline-block;font-size:11px;line-height:16px;font-weight:500;color:var(--blue);margin-left:6px}
.crow .act{display:flex;justify-content:flex-end;gap:2px;visibility:hidden}
.crow:hover .act,.crow:focus-within .act{visibility:visible}
.crow .act .on{color:var(--blue);visibility:visible}
.av{width:40px;height:40px;border-radius:999px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:40px;flex:none;overflow:hidden}
.av.xl{width:120px;height:120px;font-size:52px;line-height:120px}
.empty{padding:40px 24px;text-align:center;color:var(--text2)}
.fab{display:none}

/* person */
.pbar{display:flex;align-items:center;gap:8px;margin:-8px -8px 8px}
.pbar .grow{flex:1}
.btn{height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--blue);color:var(--on-blue);font-weight:500;display:inline-flex;align-items:center;gap:8px;flex:none}
.btn:disabled{background:var(--soft);color:var(--text2);cursor:default}
.tb{height:36px;padding:0 12px;border:0;border-radius:18px;background:transparent;color:var(--blue);font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none}
.tb:hover{background:var(--soft)}
.phead{display:flex;align-items:center;gap:28px;padding:0 8px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead h1{margin:0;font-size:28px;line-height:36px;font-weight:400}
.phead p{margin:2px 0 0;color:var(--text2)}
.labels{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lab{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-weight:500;background:transparent;color:var(--text)}
.lab svg{fill:var(--text2)}
.ract{display:none}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px;align-items:start}
.box{background:var(--soft);border-radius:16px;padding:16px 20px}
.box h2{margin:0 0 8px;font-size:16px;line-height:24px;font-weight:500}
.drow{display:flex;gap:16px;align-items:flex-start;padding:8px 0}
.drow svg{fill:var(--text2);flex:none}
.drow a{font-weight:500;font-variant-numeric:tabular-nums}
.drow .lb{font-size:12px;line-height:16px;color:var(--text2)}
.small{font-size:12px;line-height:16px;color:var(--text2)}
.qadd{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.qadd input{flex:1;height:44px;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}

/* fields */
.field{display:block;position:relative;margin:0}
.field>span{position:absolute;top:-8px;left:12px;background:var(--card);padding:0 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--text2)}
.box .field>span{background:var(--soft)}
.field input,.field textarea,.field select{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:16px;background:transparent;color:var(--text);outline:0}
.field textarea{resize:vertical;min-height:112px}
.field :focus{border:2px solid var(--blue);padding:13px 15px}
.field:focus-within>span{color:var(--blue)}
.form{display:flex;flex-direction:column;gap:22px;max-width:640px;padding:12px 0}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.acts .left{margin-right:auto}
.edit{display:flex;flex-direction:column;gap:14px;padding:16px 0 4px}

/* complaints */
.comp{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden;background:var(--card)}
.box .comp{border-color:transparent}
.comp .top2{display:flex;gap:12px;padding:14px 12px 4px 16px;align-items:flex-start}
.comp .t{font-weight:500;font-size:15px;line-height:22px}
.comp .d{white-space:pre-line;color:var(--text2);margin-top:2px}
.badge{height:24px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;font-size:12px;font-weight:500;flex:none}
.badge.open{background:var(--red-tint);color:var(--red)}.badge.done{background:var(--done);color:var(--on-done)}
.strip{display:flex;gap:8px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.pht{width:72px;height:72px;border-radius:8px;background:var(--soft);overflow:hidden;position:relative;border:0;padding:0;flex:none}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pht .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(32,33,36,.7);color:#fff;display:grid;place-items:center}
.comp .links{display:flex;gap:2px;padding:6px 8px;flex-wrap:wrap;align-items:center}
.cm{border-top:1px solid var(--line);padding:4px 8px 4px 16px}
.cm .c{padding:8px 0}.cm .c p{margin:0;white-space:pre-line}
.cm .ca{display:flex;align-items:center}
.cm .ca input{flex:1;height:40px;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}
.composer{border-radius:12px;background:var(--soft);padding:4px 8px 8px 16px;margin-bottom:16px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;padding:12px 0 6px;font-size:15px;line-height:22px;color:var(--text);min-height:46px}
.composer .tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-left:-8px}
.composer select{height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:0 8px;max-width:220px}
.mini{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
.note{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 10px;background:var(--card);color:var(--text)}
.note p{margin:0 0 4px;white-space:pre-line}

/* pick districts */
.pick{width:100%;min-height:48px;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;gap:20px;padding:0 20px;text-align:left;color:var(--text);font-weight:500}
.pick:hover{background:var(--soft)}
.pick.on{background:var(--done);color:var(--on-done)}
.box2{width:18px;height:18px;border:2px solid var(--text2);border-radius:2px;display:grid;place-items:center;flex:none}
.pick.on .box2{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 8px;padding-bottom:96px}
.pfoot{position:sticky;bottom:0;background:var(--card);padding:12px 0;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}

/* snackbar, drawer, viewer */
.snack{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:48px;padding:6px 8px 6px 16px;border-radius:4px;background:var(--snack);color:var(--snack-text);display:flex;align-items:center;gap:12px;box-shadow:var(--sh3);z-index:60;transition:transform .2s,opacity .2s}
.snack[hidden]{display:flex;opacity:0;transform:translateY(16px);pointer-events:none}
.snack button{border:0;background:transparent;color:var(--snack-action);font-weight:500;height:36px;padding:0 8px;flex:none}
.scrim{position:fixed;inset:0;background:rgba(32,33,36,.6);z-index:40}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{display:flex;justify-content:space-between;padding:8px}.viewer .ib{color:#fff}

/* phones and narrow windows */
@media (max-width:899px){
  body{background:var(--card);font-size:16px;line-height:22px}
  .top{padding:12px 16px 8px;height:auto;background:var(--card)}
  .brand{display:none}
  .search{height:48px;max-width:none;padding:0 4px}
  .search>svg{display:none}
  .menu-btn{display:grid;width:40px;height:40px}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(304px,85vw);max-height:none;background:var(--card);z-index:50;border-radius:0 16px 16px 0;padding:16px 12px 24px 0;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--sh3)}
  body.drawer .side{transform:none}
  .side .add{margin-left:12px}
  .card{margin:0;border-radius:0;padding:0 0 calc(96px + env(safe-area-inset-bottom));min-height:0}
  .card>h1.title{display:none}
  .inner h1.title{margin:8px 0 12px}
  .chips{padding:4px 16px 8px}
  .thead{display:none}
  .sec{padding:16px 20px 6px;font-size:13px;color:var(--blue)}
  .sec svg{fill:var(--blue)}
  .crow{display:flex;gap:16px;padding:8px 20px;border-radius:0}
  .crow .ph,.crow .ps,.crow .ds,.crow .act{display:none}
  .crow .nm{flex:1}
  .crow .nm b{font-weight:400;font-size:16px}
  .crow .sub{display:block;font-size:13px;line-height:18px;color:var(--text2)}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;box-shadow:var(--sh3);margin:0}
  body.nofab .fab{display:none}
  .inner{padding:0 16px}
  .pbar{margin:0;padding:4px 4px 0}
  .phead{flex-direction:column;text-align:center;gap:12px;padding:8px 16px 20px;border-bottom:0}
  .phead h1{font-size:26px;line-height:32px}
  .labels{justify-content:center}
  .ract{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 24px 20px;border-bottom:1px solid var(--line)}
  .ract a,.ract button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--blue);font-size:13px;font-weight:500;border:0;background:transparent;padding:0}
  .ract span{width:48px;height:48px;border-radius:999px;background:var(--done);display:grid;place-items:center}
  .boxes{margin:16px;grid-template-columns:minmax(0,1fr)}
  .comp .t{font-size:16px}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .pfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  body.sub .top{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="ib menu-btn" data-a="drawer" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <div class="brand"><span class="mark"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></span>Sugam Dial</div>
  <label class="search"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span class="sr">Search contacts</span><input id="q" type="search" placeholder="Search contacts" autocomplete="off" enterkeyhint="search"><button class="ib sm" id="qx" data-a="qclear" aria-label="Clear search" hidden><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></label>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main class="card" id="main" aria-live="polite"></main>
</div>
<button class="add fab" data-a="addc"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Add contact</button>
<div class="snack" id="snack" role="status" hidden><span id="snackText" style="flex:1"></span><button id="snackBtn" type="button" hidden></button></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" multiple hidden>
<input type="file" id="fRestore" accept="application/json,.json" hidden>

/* photos live in IndexedDB as compressed JPEGs */
let dbp=null;
function idb(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('sugamdial',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function pPut(id,blob){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function pGet(id){const db=await idb();return new Promise(res=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}
async function pDel(id){try{const db=await idb();db.transaction('photos','readwrite').objectStore('photos').delete(id)}catch(e){}}
async function pAll(){const db=await idb();return new Promise(res=>{const out={};const r=db.transaction('photos').objectStore('photos').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>res(out)})}
const urls={};
async function hydrate(){
  for(const img of document.querySelectorAll('img[data-pid]')){
    const id=img.dataset.pid;
    if(!urls[id]){const b=await pGet(id);if(!b)continue;urls[id]=URL.createObjectURL(b)}
    img.src=urls[id];
  }
}
function shrink(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),'image/jpeg',.85)};
    im.onerror=()=>{URL.revokeObjectURL(url);res(file)};im.src=url;
  });
}
async function addPhotos(files){
  const ids=[];
  for(const f of files){const b=await shrink(f);const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);try{await pPut(id,b);ids.push(id)}catch(e){toast('Could not store the photo on this phone.')}}
  return ids;
}

function when(at){

  const diff=(day(n)-day(d))/864e5;
  if(diff===0)return 'Today, '+t;if(diff===1)return 'Yesterday, '+t;
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'})+', '+t;
}

addEventListener('popstate',e=>{R=e.state||{s:'list',f:defaultF()};ui.ep=null;closeDrawer();render()});
const defaultF=()=>S.favs.length?'mine':'all';

/* ---------- snackbar ---------- */
let st=null;
function toast(text,label,fn){
  const el=document.getElementById('snack');document.getElementById('snackText').textContent=text;
  const b=document.getElementById('snackBtn');b.hidden=!label;b.textContent=label||'';b.onclick=()=>{el.hidden=true;fn&&fn()};
  el.hidden=false;clearTimeout(st);st=setTimeout(()=>el.hidden=true,label?7000:3500);
}

/* ---------- drawer (phones) ---------- */
function openDrawer(){document.body.classList.add('drawer');if(!document.getElementById('scrim')){const s=document.createElement('div');s.className='scrim';s.id='scrim';s.onclick=closeDrawer;document.body.append(s)}document.querySelector('#side button')?.focus()}
function closeDrawer(){document.body.classList.remove('drawer');document.getElementById('scrim')?.remove()}

/* ---------- filters ---------- */
function pool(f){
  const all=allContacts();
  if(f==='all')return all;
  if(f==='mine')return all.filter(o=>o.dists.some(i=>S.favs.includes(i)));
  if(f==='star')return all.filter(isStar);
  if(f.startsWith('d:')){const id=f.slice(2);return all.filter(o=>o.dists.includes(id))}
  if(f.startsWith('g:')){const g=f.slice(2);return all.filter(o=>o.level===g)}
  return all;
}
const fName=f=>f==='all'?'Contacts':f==='mine'?'My districts':f==='star'?'Starred':f.startsWith('d:')?(D.byId[f.slice(2)]?.name||''):GNAME[f.slice(2)]||'';
const matches=(o,q)=>!q||(o.name+' '+o.person+' '+o.dists.map(i=>D.byId[i].name).join(' ')+' '+o.numbers.map(x=>x.n.replace(/\s/g,'')).join(' ')+' '+ph(o).replace(/\s/g,'')).toLowerCase().includes(q.replace(/\s+/g,' '));

function rowHtml(o){
  const n=ph(o);
  return `<div class="crow" role="link" tabindex="0" data-a="person" data-id="${esc(o.id)}">
   <div class="nm">${avatar(o)}<span><b>${esc(title(o))}</b><span class="sub">${esc(o.person?o.name:'')}${o.person?' · ':''}${esc(distLabel(o))}</span></span></div>
   <div class="ps">${esc(o.person?o.name:'')}</div>
   <div class="ph">${n?esc(n):'<span class="small">No number</span>'}${S.phones[o.id]!=null?'<span class="tag">edited</span>':''}</div>
   <div class="ds">${esc(distLabel(o))}</div>
   <div class="act"><button class="ib sm${isStar(o)?' on':''}" data-a="star" data-id="${esc(o.id)}" aria-label="${isStar(o)?'Unstar':'Star'} ${esc(title(o))}" aria-pressed="${isStar(o)}">${ic(isStar(o)?'star':'starO','i s')}</button><button class="ib sm" data-a="editp" data-id="${esc(o.id)}" aria-label="Edit ${esc(title(o))}">${ic('edit','i s')}</button></div>
  </div>`;
}
function vList(){
  const f=R.f||defaultF();const q=(ui.q||'').trim().toLowerCase();
  const base=q?allContacts():pool(f);
  const found=base.filter(o=>matches(o,q));
  const posts=GROUPS.map(g=>g[0]).filter(g=>found.some(o=>o.level===g));
  const pf=posts.includes(ui.post)?ui.post:null;
  const list=found.filter(o=>!pf||o.level===pf);
  const starred=f==='star'?[]:list.filter(isStar).sort(byRank);
  const rest=list.filter(o=>f==='star'||!isStar(o));
  const CHIP={TOP:'Top officers',DGM:'DGM',PD:'Project Directors',SPL:'Electrical & QC',HQ:'Head office',Other:'Added by you'};
  const head=q?`Results for “${esc(ui.q.trim())}”`:esc(fName(f));
  let body='';
  if(starred.length)body+=`<div class="sec">${ic('star','i xs')}Starred (${starred.length})</div>`+starred.map(rowHtml).join('');
  for(const [g] of GROUPS){const rows=rest.filter(o=>o.level===g).sort(byRank);if(!rows.length)continue;body+=`<div class="sec">${esc(GNAME[g])} (${rows.length})</div>`+rows.map(rowHtml).join('')}
  if(!list.length)body=`<div class="empty">${q?'No contact matches that. Try a district, a post like “PD”, or part of a number.':f==='mine'?'None of your districts has a contact in the RSRDC list yet. Open Contacts in the menu to see everyone, or add a contact.':'No contacts here yet.'}</div>`;
  return `<h1 class="title">${head} <small>(${list.length})</small></h1>
  ${posts.length>1?`<div class="chips" role="group" aria-label="Filter by post"><button class="chip${pf?'':' on'}" data-a="post" data-v="" aria-pressed="${!pf}">All</button>${posts.map(g=>`<button class="chip${g===pf?' on':''}" data-a="post" data-v="${g}" aria-pressed="${g===pf}">${esc(CHIP[g])}</button>`).join('')}</div>`:''}
  <div class="thead" role="presentation"><span>Name</span><span>Post</span><span>Phone</span><span>District</span><span></span></div>
  ${body}`;
}

  const v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-label','Photo');
  v.innerHTML=`<div class="vb"><button class="ib" aria-label="Close">${ic('close')}</button>${owner?`<button class="ib" aria-label="Delete photo">${ic('del')}</button>`:''}</div><img src="${urls[id]}" alt="Complaint photo">`;
  const [cl,dl]=v.querySelectorAll('button');cl.onclick=()=>v.remove();
  if(dl)dl.onclick=()=>{const c=S.complaints.find(x=>'c'+x.id===owner);if(c){c.photos=c.photos.filter(p=>p!==id);save();pDel(id)}v.remove();render();toast('Photo deleted')};
  document.body.append(v);cl.focus();
}

/* ---------- sharing ---------- */
async function shareComplaint(c){
  const text=[c.title,c.details,'For: '+where(c),'Since: '+when(c.at),c.comments.length?'Updates:\n'+c.comments.map(m=>'- '+m.text+' ('+when(m.at)+')').join('\n'):''].filter(Boolean).join('\n');
  const files=[];for(const id of c.photos){const b=await pGet(id);if(b)files.push(new File([b],id+'.jpg',{type:'image/jpeg'}))}
  try{
    if(files.length&&navigator.canShare&&navigator.canShare({files})){await navigator.share({title:c.title,text,files});return}
    if(navigator.share){await navigator.share({title:c.title,text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(text);a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();
}

/* ---------- backup ---------- */
async function backup(){
  const photos={};const all=await pAll();
  for(const [k,b] of Object.entries(all)){photos[k]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
  const blob=new Blob([JSON.stringify({app:'sugam-dial',v:1,at:Date.now(),data:S,photos})],{type:'application/json'});
  const name='sugam-dial-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sugam Dial backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
  toast('Backup saved to Downloads');
}
async function restore(file){
  try{
    const j=JSON.parse(await file.text());if(j.app!=='sugam-dial'||!j.data)throw 0;
    for(const [k,u] of Object.entries(j.photos||{})){const b=await (await fetch(u)).blob();await pPut(k,b)}
    S=Object.assign(blank(),j.data);save();rebuildCustom();swap({s:'list',f:defaultF()});toast('Backup restored');
  }catch(e){toast('That file is not a Sugam Dial backup.')}
}

/* ---------- after a call: offer a note ---------- */
let lastCall=null;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&lastCall&&Date.now()-lastCall.t<30*60e3){
    const o=D.offices[lastCall.id];lastCall=null;
    if(o)setTimeout(()=>toast('Call ended. Add a note?','Add note',()=>{ui.nt='';go({s:'newn',dist:o.distId,office:o.id})}),400);
  }
});


/* ---------- actions ---------- */
let photoTarget=null;
const keepY=fn=>{const y=scrollY;fn();scrollTo(0,y)};
const A={
  drawer:()=>openDrawer(),
  back:()=>{if(R.s==='newc'&&!ui.saved)(ui.dp||[]).forEach(pDel);if(R.s==='newc'||R.s==='newn'){ui.dp=[];ui.fs=ui.fd=ui.nt=''}back()},
  nav:(el)=>{ui.q='';syncQ();const f=el.dataset.v;if(R.s==='list')swap({s:'list',f});else go({s:'list',f})},
  go:(el)=>{ui.q='';syncQ();const s=el.dataset.v;if(R.s===s){closeDrawer();return}go({s})},
  person:(el)=>{if(!el.dataset.id)return A.nav(el);ui.ep=null;go({s:'person',id:el.dataset.id})},
  editp:(el)=>{const id=el.dataset.id;ui.ep=id;if(R.s!=='person'||R.id!==id)go({s:'person',id});else render();setTimeout(()=>{const i=document.getElementById(D.offices[id]?.custom?'eName':'phIn');if(i){i.focus();i.scrollIntoView({block:'center'})}},30)},
  star:(el)=>{const id=el.dataset.id,on=S.starred.includes(id);S.starred=on?S.starred.filter(x=>x!==id):S.starred.concat(id);save();keepY(render)},
  mpick:()=>{ui.pick=[...S.favs];go({s:'pick'})},
  backup:()=>{closeDrawer();backup()},
  restore:()=>{closeDrawer();document.getElementById('fRestore').click()},
  qclear:()=>{ui.q='';syncQ();renderMain();document.getElementById('q').focus()},
  pick:(el)=>{const s=new Set(ui.pick);s.has(el.dataset.id)?s.delete(el.dataset.id):s.add(el.dataset.id);ui.pick=[...s];keepY(render)},
  pickdone:(el)=>{if(!el.dataset.skip)S.favs=D.list.map(d=>d.id).filter(id=>ui.pick.includes(id));S.onboarded=true;save();ui.pick=null;swap({s:'list',f:defaultF()})},
  call:(el)=>{lastCall={id:el.dataset.id,t:Date.now()};return true},
  phcancel:()=>{ui.ep=null;render()},
  phsave:(el)=>{const o=D.offices[el.dataset.id];const v=document.getElementById('phIn').value.trim();
    if(o.custom){const c=S.custom.find(x=>x.id===o.id);c.phone=v;const nm=document.getElementById('eName');if(nm&&nm.value.trim())c.name=c.short=nm.value.trim();delete S.phones[o.id];rebuildCustom()}
    else if(!v||v===o.phone)delete S.phones[o.id];else S.phones[o.id]=v;
    save();ui.ep=null;render();toast(v?'Saved':'Number removed')},
  phreset:(el)=>{delete S.phones[el.dataset.id];save();ui.ep=null;render();toast('Back to the RSRDC number')},
  addc:()=>{closeDrawer();ui.nd=(R.f||'').startsWith('d:')?R.f.slice(2):'';go({s:'addc'});setTimeout(()=>document.getElementById('ncPerson')?.focus(),30)},
  addcSave:()=>{const person=document.getElementById('ncPerson').value.trim(),name=document.getElementById('ncName').value.trim();
    if(!person&&!name){document.getElementById('ncPerson').focus();return}
    const c={id:'u'+nid(),distId:document.getElementById('ncDist').value,level:'Other',name:name||person,person:name?person:'',short:name||person,phone:document.getElementById('ncPhone').value.trim()};
    S.custom.push(c);save();rebuildCustom();swap({s:'person',id:c.id});toast('Contact added')},
  delc:(el)=>{const id=el.dataset.id;const c=S.custom.find(x=>x.id===id);S.custom=S.custom.filter(x=>x.id!==id);S.starred=S.starred.filter(x=>x!==id);save();rebuildCustom();ui.ep=null;back();
    toast('Contact removed','Undo',()=>{S.custom.push(c);save();rebuildCustom();render()})},
  cam:()=>{photoTarget=R.s;document.getElementById('fCam').click()},
  gal:()=>{photoTarget=R.s;document.getElementById('fGal').click()},
  dprm:(el)=>{pDel(el.dataset.id);ui.dp=(ui.dp||[]).filter(x=>x!==el.dataset.id);keepY(render)},
  cadd:()=>{const t=(ui.ct||'').trim();if(!t){document.getElementById('ctext').focus();return}
    const lines=t.split('\n');const dist=document.getElementById('cdist').value;
    S.complaints.unshift({id:nid(),distId:dist,officeId:document.getElementById('cto').value||null,title:lines[0].trim(),details:lines.slice(1).join('\n').trim(),photos:ui.dp||[],status:'open',at:Date.now(),comments:[]});
    save();ui.ct='';ui.dp=[];ui.cto='';ui.cf='open';render();toast('Complaint saved on this device')},
  newc:(el)=>{const o=D.offices[el.dataset.id];ui.dp=[];ui.fs=ui.fd='';ui.saved=false;go({s:'newc',dist:o.distId,office:o.id})},
  newn:(el)=>{const o=D.offices[el.dataset.id];ui.nt='';go({s:'newn',dist:o.distId,office:o.id})},
  csave:()=>{const subj=document.getElementById('fSubj').value.trim(),det=document.getElementById('fDet').value.trim();
    if(!subj&&!det){document.getElementById('fSubj').focus();return}
    S.complaints.unshift({id:nid(),distId:R.dist,officeId:document.getElementById('fFor').value||null,title:subj||det.split('\n')[0],details:subj?det:det.split('\n').slice(1).join('\n'),photos:ui.dp||[],status:'open',at:Date.now(),comments:[]});
    save();ui.saved=true;ui.dp=[];ui.fs=ui.fd='';back();setTimeout(()=>toast('Complaint saved on this device'),50)},
  nsave:()=>{const t=document.getElementById('nText').value.trim();if(!t){document.getElementById('nText').focus();return}
    S.notes.unshift({id:nid(),distId:R.dist,officeId:document.getElementById('nFor').value||null,text:t,at:Date.now()});save();ui.nt='';back();setTimeout(()=>toast('Note saved'),50)},
  qnote:()=>{const i=document.getElementById('qn');const t=i.value.trim();if(!t){i.focus();return}const o=D.offices[R.id];
    if(t.startsWith('!')){const body=t.slice(1).trim();if(!body)return;S.complaints.unshift({id:nid(),distId:o.distId,officeId:o.id,title:body,details:'',photos:[],status:'open',at:Date.now(),comments:[]});save();keepY(render);toast('Complaint saved')}
    else{S.notes.unshift({id:nid(),distId:o.distId,officeId:o.id,text:t,at:Date.now()});save();keepY(render);toast('Note saved')}},
  ctoggle:(el)=>{const c=S.complaints.find(x=>x.id==el.dataset.id);c.status=c.status==='open'?'resolved':'open';save();keepY(render);
    toast(c.status==='resolved'?'Marked resolved':'Reopened','Undo',()=>{c.status=c.status==='open'?'resolved':'open';save();keepY(render)})},
  cdel:(el)=>{const i=S.complaints.findIndex(x=>x.id==el.dataset.id);const c=S.complaints[i];S.complaints.splice(i,1);save();keepY(render);
    let undone=false;toast('Complaint deleted','Undo',()=>{undone=true;S.complaints.splice(i,0,c);save();keepY(render)});setTimeout(()=>{if(!undone)c.photos.forEach(pDel)},7500)},
  cpost:(el)=>{const id=el.dataset.id;const txt=((ui.cd||{})[id]||'').trim();if(!txt)return;const c=S.complaints.find(x=>x.id==id);c.comments.push({text:txt,at:Date.now()});save();ui.cd[id]='';keepY(render)},
  cshare:(el)=>shareComplaint(S.complaints.find(x=>x.id==el.dataset.id)),
  cf:(el)=>{ui.cf=el.dataset.v;render()},
  post:(el)=>{ui.post=el.dataset.v||null;renderMain()},
  view:(el)=>viewPhoto(el.dataset.id,el.dataset.owner)
};
function syncQ(){const q=document.getElementById('q');if(q.value!==ui.q)q.value=ui.q;document.getElementById('qx').hidden=!ui.q}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;
  const keep=fn(el,e);if(keep!==true&&el.tagName==='A')e.preventDefault();
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){const v=document.querySelector('.viewer');if(v)v.remove();else if(document.body.classList.contains('drawer'))closeDrawer();else if(ui.q){A.qclear()}}
  if(e.key==='Enter'&&t.classList&&t.classList.contains('crow')){e.preventDefault();A.person(t)}
  if(e.key==='Enter'&&t.dataset&&t.dataset.cd){e.preventDefault();A.cpost({dataset:{id:t.dataset.cd}})}
  if(e.key==='Enter'&&t.id==='qn'){e.preventDefault();A.qnote()}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){e.preventDefault();document.getElementById('q').focus()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;document.getElementById('qx').hidden=!ui.q;if(R.s!=='list'){R={s:'list',f:R.f||defaultF()};try{history.pushState(R,'')}catch(e){}document.body.classList.remove('sub','nofab')}renderMain()}
  else if(t.id==='ctext'){ui.ct=t.value;t.rows=t.value?3:1}
  else if(t.id==='fSubj')ui.fs=t.value;else if(t.id==='fDet')ui.fd=t.value;else if(t.id==='nText')ui.nt=t.value;
  else if(t.dataset&&t.dataset.cd){ui.cd=ui.cd||{};ui.cd[t.dataset.cd]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cdist'){ui.cdist=t.value;ui.cto='';keepY(render)}
  else if(t.id==='cto')ui.cto=t.value;
  else if(t.id==='cfd'){ui.cdist=t.value;keepY(render)}
});
for(const id of ['fCam','fGal'])document.getElementById(id).addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  const ids=await addPhotos(files);ui.dp=(ui.dp||[]).concat(ids);if(R.s===photoTarget)keepY(render);
});
document.getElementById('fRestore').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f)});
let wasPhone=isPhone();addEventListener('resize',()=>{const p=isPhone();if(p!==wasPhone){wasPhone=p;closeDrawer()}});

/* ---------- start ---------- */
R=S.onboarded?{s:'list',f:defaultF()}:{s:'pick'};
try{history.replaceState(R,'')}catch(e){}
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
